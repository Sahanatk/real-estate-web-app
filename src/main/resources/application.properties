spring.application.name=myOwnRealtorWebsite

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Logging
logging.level.root=WARN
logging.level.com.example.myOwnRealtorWebsite=INFO

# Admin credentials
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Agent details - public info
agent.name=Sindhu Jakka
agent.profile-picture-url=https://res.cloudinary.com/yjqtho1g/image/upload/v1786650897/agent_ihfbsq.jpg
agent.home-page-url=https://res.cloudinary.com/yjqtho1g/image/upload/v1786650896/agentHomePage_nvscr1.jpg
agent.biography=I've called Seattle home for years, and since 2018, I've helped neighbors just like you call it home too. Whether you're searching for your first home, selling a place full of memories, or hunting for the perfect investment property, I bring the kind of warmth and know-how that makes a big decision feel a little less overwhelming. I have a special knack for spotting potential where others see a fixer-upper, guiding clients through value-add properties, from renovation to resale, for strong returns. My approach blends genuine care with a sharp eye for market trends and neighborhood-level value, so every recommendation I make is backed by real data, not just instinct. Whether you're a first-time buyer, a seller, or a seasoned investor, you can count on me for transparency and client-focused service from start to finish. At the end of the day, I am a people person who loves connecting clients with the right home, at the right price, at the right time. When you work with me, you are not just getting an agent - you are gaining a knowledgeable friend in your corner who knows Seattle inside and out.
agent.speciality=Residential and Commercial Multi-Family
agent.years-of-experience=8

# Agent details - sensitive info
agent.license-number=${AGENT_LICENSE_NUMBER}
agent.total-sales-volume=${AGENT_TOTAL_SALES_VOLUME}


# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Google Places
google.places.api-key=${GOOGLE_PLACES_API_KEY}
google.places.place-id=${GOOGLE_PLACE_ID}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Token expiry
app.reset-token-expiry=30

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false