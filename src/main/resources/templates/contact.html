<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Sindhu Jakka Real Estate</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div th:replace="~{fragments/layout :: main(~{::section})}">
    <section>

        <div class="contact-hero">
            <div class="container">
                <h1>Get in Touch</h1>
                <div class="gold-line"></div>
                <p>Have a question about a property or just want to explore your options? I'm here.</p>
            </div>
        </div>

        <div class="container py-5">
            <div class="contact-card" data-aos="fade-up">

                <h2 th:text="${listing != null} ? 'Inquire About This Property' : 'Send a Message'">
                    Send a Message
                </h2>
                <!-- Listing context if coming from a property page -->
                <div th:if="${listing != null}" class="listing-info mb-3">
                    <strong th:text="${listing.city}">City</strong>
                    <span th:text="' · $' + ${#numbers.formatDecimal(listing.listingPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                </div>

                <form th:action="@{/contact}" method="post">
                    <input type="hidden" name="listingId"
                           th:if="${listing != null}"
                           th:value="${listing.listingId}">


                    <div sec:authorize="isAnonymous()">
                        <div class="mb-3">
                            <label class="form-label-custom">Your Name</label>
                            <input type="text" name="visitorName" class="form-control"
                                   placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Your Email</label>
                            <input type="email" name="visitorEmail" class="form-control"
                                   placeholder="Enter your email" required>
                        </div>
                    </div>
                    <label>Your Message</label>
                    <textarea name="message"
                              placeholder="Tell me what you're looking for, or ask anything about this property..."
                              required></textarea>

                    <button type="submit" class="btn-send">Send Message &#8594;</button>
                </form>

                <div th:if="${success}" class="success-banner">
                    Thank you! Your message has been sent. Redirecting you home shortly...
                </div>

                <script th:if="${success}">
                    setTimeout(function() { window.location.href = "/"; }, 3000);
                </script>

            </div>
        </div>

    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({ duration: 800, once: true, offset: 80 });</script>
</body>
</html>
