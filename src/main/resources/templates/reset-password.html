<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reset Password — Sindhu Jakka Real Estate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="anc-container">
  <a th:href="@{/login}"
     style="font-family: 'Playfair Display', serif; color: var(--text-navy, #2C3E50); text-decoration: none; font-size: 0.9rem;">
    &#8592; Back to Login
  </a>
</div>

<div class="login-page">
  <div class="login-container">

    <div class="left-section">
      <div>
        <h1>Sindhu Jakka</h1>
        <p>Choose a strong new password to keep your account secure.</p>
      </div>
      <div class="tag-box">
        <h2>Secure Your Account</h2>
      </div>
    </div>

    <div class="right-section">
      <div class="login-form">

        <h2>Reset Password</h2>
        <p>Enter and confirm your new password below.</p>

        <div th:if="${error}"
             style="background:#fce4ec; border-left:3px solid #c62828; border-radius:4px; padding:0.9rem 1rem; margin-bottom:1.25rem; font-family:'Roboto',sans-serif; font-size:0.88rem; color:#c62828;"
             th:text="${error}">
        </div>

        <form th:action="@{/reset-password}" method="post">
          <input type="hidden" name="token" th:value="${token}">

          <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password"
                   placeholder="Enter new password (min 8 characters)"
                   required minlength="8">
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword"
                   placeholder="Confirm your new password"
                   required minlength="8">
          </div>

          <!-- Password strength hint -->
          <p style="font-family:'Roboto',sans-serif; font-size:0.78rem; color:#999; margin-top:-0.5rem; margin-bottom:1.25rem;">
            Use at least 8 characters with a mix of letters and numbers.
          </p>

          <button type="submit" class="login-btn">Reset Password &#8594;</button>
        </form>

        <div class="bottom-text">
          <a th:href="@{/login}">Back to Login</a>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
