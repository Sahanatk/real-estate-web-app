<body>
<div th:replace="~{fragments/layout :: main(~{::div.admin-page-body})}">
  <div class="admin-page-body" th:remove="tag">
    <div class="admin-shell">
      <nav th:replace="~{fragments/admin-sidebar :: sidebar(activePage='reviews')}"></nav>

      <div class="admin-content">
        <h2 class="page-heading">Review Moderation</h2>

        <!-- Empty state -->
        <div th:if="${pendingReviews == null or pendingReviews.isEmpty()}" class="empty-state">
          <div class="empty-icon">&#9733;</div>
          <p>No reviews waiting for approval — you're all caught up!</p>
        </div>

        <!-- Reviews table -->
        <table class="review-table"
               th:if="${pendingReviews != null and !pendingReviews.isEmpty()}">
          <thead>
          <tr>
            <th>Reviewer</th>
            <th>Rating</th>
            <th>Comment</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="review : ${pendingReviews}">
            <td>
              <span class="reviewer-name" th:text="${review.user.fullName}">Author</span>
            </td>
            <td>
                <span class="star-rating">
                  <span th:each="i : ${#numbers.sequence(1, review.rating)}">&#9733;</span>
                </span>
            </td>
            <td th:text="${review.comment}">Review text...</td>
            <td>
              <form th:action="@{/admin/{id}/approve(id=${review.id})}" method="post" class="d-inline">
                <button type="submit" class="btn-approve">&#10003; Approve</button>
              </form>
              <form th:action="@{/admin/{id}/delete(id=${review.id})}" method="post" class="d-inline">
                <button type="submit" class="btn-delete"
                        onclick="return confirm('Delete this review?')">
                  &#10005; Delete
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
