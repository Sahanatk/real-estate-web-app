<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
  <!--<link rel="stylesheet" href="https://jsdelivr.net">-->
  <!-- Your custom high-end styles last to override Bootstrap defaults -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Title</title>
</head>
<body>
<div style="display: flex; flex-direction: column; min-height: 100vh; background: #f7f5f2;">
<div class="anc-container">
  <a th:href="@{/}"
     class="d-inline-flex align-items-center gap-2"
     style="color: var(--text-navy, #2C3E50); text-decoration: none; font-family: 'Playfair Display', serif;">
    &#8592; Back to Home
  </a>
</div>
<div class = "login-page">
  <div class="login-container">

  <div class="left-section">
    <div>
      <h1>Join today.<br>Discover tomorrow.</h1>
      <p>
        Create your account to save favorite properties,
         and manage the listings.
      </p>
    </div>

    <div class="tag-box">
      <h2>Start Your Real Estate Journey</h2>
    </div>
  </div>

  <div class="right-section">

    <form class="register-form" th:action="@{/register}" th:object="${user}" method="post">

      <h2>Create Account</h2>
      <p>Register to explore properties and connect with agent.</p>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" th:field="*{fullName}" placeholder=" Enter your fullname " required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" th:field="*{password}" placeholder="Create password" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="number" th:field="*{phone}" placeholder="Phone Number" required>
      </div>

      <div class="form-group">
        <label>Register as</label>
        <label>
          <select th:field="*{role}" required>
            <option value="">-- Select Role --</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            <label>
              <select>
                <option value="">-- Select Role --</option>
                <option value="ADMIN">ADMIN</option>
                <option value="AGENT">AGENT</option>
                <option value="BUYER">BUYER</option>
                <option value="SELLER">SELLER</option>
                <option value="USER">USER</option>
              </select>
            </label>
          </select>
        </label>

      </div>

      <button type="submit" class="login-btn">
        Register
      </button>

      <div class="bottom-text">
        Already have an account?
        <a th:href="@{/login}">Login</a>
      </div>
    </form>

  </div>
  </div>
</div>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init();
</script>
</body>
</html>
