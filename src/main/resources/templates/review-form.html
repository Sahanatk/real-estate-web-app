<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Leave a Review — Sindhu Jakka Real Estate</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: main(~{::section})}">
  <section>

    <!-- Hero -->
    <div class="review-hero">
      <div class="container text-center">
        <h1>Share Your Experience</h1>
        <div class="gold-line"></div>
        <p>Your feedback helps others make confident real estate decisions.</p>
      </div>
    </div>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="review-form-card" data-aos="fade-up">

            <div th:if="${success}" class="success-banner mb-4">
              &#10003; Thank you! Your review has been submitted and is pending approval.
            </div>

            <h2>Leave a Review</h2>
            <div class="star-preview">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
            <div class="form-divider"></div>

            <form th:action="@{/reviews}" th:object="${review}" method="post">

              <!-- Name field for anonymous users - inside form -->
              <div sec:authorize="isAnonymous()" class="mb-4 text-start">
                <label class="form-label-custom">Your Name</label>
                <input type="text" name="visitorName"
                       id="visitorNameInput"
                       class="rating-select"
                       placeholder="Enter your name"
                       required
                       oninput="updateNamePreview(this.value)">
              </div>

              <!-- Live name preview for anonymous -->
              <div sec:authorize="isAnonymous()" class="mb-4 text-center">
                <p class="reviewer-tag">Reviewing as</p>
                <span id="namePreview" class="reviewer-name">Your Name</span>
              </div>

              <!-- Show username for logged in users -->
              <div sec:authorize="isAuthenticated()" class="mb-4 text-center">
                <p class="reviewer-tag">Reviewing as</p>
                <span sec:authentication="name" class="reviewer-name">Username</span>
              </div>

              <div class="mb-4 text-start">
                <label class="form-label-custom">Your Rating</label>
                <select th:field="*{rating}" class="rating-select">
                  <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; — 5 · Excellent</option>
                  <option value="4">&#9733;&#9733;&#9733;&#9733; — 4 · Good</option>
                  <option value="3">&#9733;&#9733;&#9733; — 3 · Average</option>
                  <option value="2">&#9733;&#9733; — 2 · Below Average</option>
                  <option value="1">&#9733; — 1 · Poor</option>
                </select>
              </div>

              <div class="mb-4 text-start">
                <label class="form-label-custom">Your Comment</label>
                <textarea th:field="*{comment}"
                          class="comment-area"
                          placeholder="Tell others about your experience working with Sindhu..."></textarea>
              </div>

              <button type="submit" class="btn-post-review">Post Review &#8594;</button>

            </form>
          </div>
        </div>
      </div>
    </div>

  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true, offset: 80 });

  function updateNamePreview(value) {
    document.getElementById('namePreview').textContent = value || 'Your Name';
  }
</script>
</body>
</html>
