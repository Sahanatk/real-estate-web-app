<body>
<div th:replace="~{fragments/layout :: main(~{::section})}">
  <section class="container py-5">

    <h2 class="form-heading" data-aos="fade-up"
        th:text="${editMode} ? 'Edit Listing' : 'Create New Property Listing'">
      Create New Property Listing
    </h2>
    <!-- Flash messages -->
    <div th:if="${success}" class="success-banner" th:text="${success}"></div>
    <div th:if="${error}" class="error-banner" th:text="${error}"></div>

    <div class="form-card" data-aos="fade-up">
      <!-- Change the form action to be dynamic -->
      <form th:action="${editMode} ? @{/admin/listings/{id}/save(id=${listing.listingId})} : @{/admin/save}"
            th:object="${listing}"
            enctype="multipart/form-data"
            method="post"
            class="row g-3">
        <!-- Address -->
        <div class="col-12">
          <div class="section-divider">Address</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Street Address</label>
          <input type="text" th:field="*{street}" class="form-control" th:errorclass="is-invalid" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">City</label>
          <input type="text" th:field="*{city}" class="form-control" th:errorclass="is-invalid" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
        </div>
        <div class="col-md-2">
          <label class="form-label">State</label>
          <input type="text" th:field="*{state}" class="form-control" th:errorclass="is-invalid" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
        </div>
        <div class="col-md-1">
          <label class="form-label">Zip</label>
          <input type="text" th:field="*{zipCode}" class="form-control" th:errorclass="is-invalid" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"></div>
        </div>

        <!-- Property Details -->
        <div class="col-12">
          <div class="section-divider">Property Details</div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Property Type</label>
          <select th:field="*{propertyType}" class="form-select">
            <option value="">-- Select Type --</option>
            <option th:each="type : ${propertyTypes}" th:value="${type}" th:text="${type}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Listing Price ($)</label>
          <input type="number" th:field="*{listingPrice}" class="form-control" step="0.01" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('listingPrice')}" th:errors="*{listingPrice}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Listing Status</label>
          <select th:field="*{status}" class="form-select">
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Bedrooms</label>
          <input type="number" th:field="*{bedrooms}" class="form-control" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('bedrooms')}" th:errors="*{bedrooms}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Bathrooms</label>
          <input type="number" th:field="*{bathrooms}" class="form-control" step="0.5" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('bathrooms')}" th:errors="*{bathrooms}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Square Footage</label>
          <input type="number" th:field="*{squareFootage}" class="form-control" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('squareFootage')}" th:errors="*{squareFootage}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Year Built</label>
          <input type="number" th:field="*{yearBuilt}" class="form-control" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('yearBuilt')}" th:errors="*{yearBuilt}"></div>
        </div>

        <!-- Financial -->
        <div class="col-12">
          <div class="section-divider">Financial</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Tax ID (APN / Parcel ID)</label>
          <input type="text" th:field="*{taxInformation}" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">HOA Fees ($/mo)</label>
          <input type="number" th:field="*{hoaFees}" class="form-control" step="0.01" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('hoaFees')}" th:errors="*{hoaFees}"></div>
        </div>

        <!-- Features -->
        <div class="col-12">
          <div class="section-divider">Features & Media</div>
        </div>
        <div class="col-12">
          <label class="form-label">Property Features</label>
          <input type="text" name="propertyFeatures" class="form-control"
                 placeholder="Pool, HVAC, Mountain View, Garden">
          <div class="form-text">Separate features with commas.</div>
          <div th:if="${listing.propertyFeatures != null and !listing.propertyFeatures.isEmpty()}"
               class="mt-2 d-flex flex-wrap">
            <span th:each="feature : ${listing.propertyFeatures}"
                  class="feature-tag"
                  th:text="${feature}"></span>
          </div>
        </div>

        <!-- Photos -->
        <div class="col-12">
          <label class="form-label">Property Photos</label>
          <input type="file" name="photoFiles" class="form-control"
                 multiple accept="image/*">
          <div class="form-text">Select multiple photos (JPG, PNG, WebP — max 10MB each).</div>
          <div th:if="${listing.photos != null and !listing.photos.isEmpty()}"
               class="mt-3 d-flex flex-wrap gap-2">
            <img th:each="url : ${listing.photos}"
                 th:src="${url}"
                 class="photo-preview"
                 alt="Property photo">
          </div>
        </div>

        <!-- Submit -->
        <div class="col-12 mt-3 d-flex justify-content-end">
          <button type="submit" class="btn-publish" id="publishBtn"
                  onclick="this.disabled=true; this.textContent='Publishing...'; this.form.submit();">
            Publish Listing &#8594;
          </button>
        </div>

      </form>
    </div>

  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({ duration: 800, once: true, offset: 80 });</script>
