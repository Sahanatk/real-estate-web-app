<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin — Messages</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: main(~{::div.admin-page-body})}">
  <div class="admin-page-body" th:remove="tag">
    <div class="admin-shell">
      <nav th:replace="~{fragments/admin-sidebar :: sidebar(activePage='messages')}"></nav>

      <div class="admin-content">
        <h2 class="page-heading">Inquiries</h2>

        <!-- Flash messages -->
        <div th:if="${success}"
             style="background:#e8f5e9; border-left:3px solid #2e7d32; border-radius:4px;
                    padding:1rem 1.25rem; margin-bottom:1.5rem; font-family:'Roboto',sans-serif;
                    font-size:0.9rem; color:#2e7d32;"
             th:text="${success}">
        </div>

        <!-- Empty state -->
        <div th:if="${inquiries == null or inquiries.isEmpty()}" class="empty-state">
          <div class="empty-icon">&#9993;</div>
          <p>No messages yet — your inbox is clear!</p>
        </div>

        <!-- Messages table -->
        <div class="table-responsive" th:if="${inquiries != null and !inquiries.isEmpty()}">
          <table class="messages-table">
            <thead>
            <tr>
              <th>From</th>
              <th>Listing</th>
              <th>Message</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inquiry : ${inquiries}" th:id="'inquiry-row-' + ${inquiry.id}">
              <td>
                <!-- Logged in user -->
                <span th:if="${inquiry.user != null}">
                    <span class="sender-name" th:text="${inquiry.user.fullName}">Name</span>
                    <span class="sender-email" th:text="${inquiry.user.email}">email</span>
                  </span>
                <!-- Anonymous user -->
                <span th:if="${inquiry.user == null}">
                  <span class="sender-name"
              th:text="${inquiry.visitorName != null ? inquiry.visitorName : 'Anonymous'}">
            Anonymous
              </span>
        <span class="sender-email"
              th:text="${inquiry.visitorEmail != null ? inquiry.visitorEmail : 'No email provided'}">
            No email
        </span>
    </span>
              </td>
              <td>
                <a th:if="${inquiry.property != null}"
                   class="listing-link"
                   th:href="@{/listings/{id}(id=${inquiry.property.listingId})}"
                   th:text="${inquiry.property != null ? inquiry.property.street : 'General inquiry'}"></a>
                <span th:if="${inquiry.property == null}"
                      style="font-style:italic; color:#bbb; font-size:0.82rem;">
                    General inquiry
                  </span>
              </td>
              <td th:text="${inquiry.message}">Message text...</td>
              <td class="text-nowrap">
                <button type="button"
                        class="btn-contacted action-btn contacted-btn"
                        th:data-id="${inquiry.id}"
                        th:disabled="${inquiry.status.name() != 'NEW'}"
                        th:text="${inquiry.status.name() == 'NEW'} ? 'Mark Contacted' : 'Contacted'">
                  Mark Contacted
                </button>

                <!-- Replace the Reply button with this -->
<!--                <a class="btn-reply"-->
<!--                   th:with="replyEmail=${inquiry.user != null ? inquiry.user.email : inquiry.visitorEmail}"-->
<!--                   th:href="${replyEmail != null} ? 'mailto:' + ${replyEmail} : '#'">-->
<!--                  Reply-->
<!--                </a>-->

                  <a class="btn-reply"
                     th:with="replyEmail=${inquiry.user != null ? inquiry.user.email : inquiry.visitorEmail}"
                     th:href="${replyEmail != null} ?
            'https://mail.google.com/mail/?view=cm&to=' + ${replyEmail} + '&su=Re: Your inquiry' :
            '#'"
                     target="_blank">
                      Reply
                  </a>
<!--                <span th:if="${inquiry.user == null}"-->
<!--                      class="btn-reply"-->
<!--                      style="opacity:0.4; cursor:default;">-->
<!--                    Reply-->
<!--                  </span>-->
                <button type="button"
                        class="btn-close-inquiry close-btn"
                        th:data-id="${inquiry.id}">
                  Close
                </button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true });

  document.querySelectorAll('.contacted-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-id');
      btn.disabled = true;
      btn.textContent = 'Contacted';
      fetch('/admin/messages/' + id + '/contacted', { method: 'POST' })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Mark Contacted';
        });
    });
  });

  document.querySelectorAll('.close-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-id');
      var row = document.getElementById('inquiry-row-' + id);
      if (row) row.style.opacity = '0.4';
      fetch('/admin/messages/' + id + '/close', { method: 'POST' })
        .then(function() { if (row) row.remove(); })
        .catch(function() { if (row) row.style.opacity = '1'; });
    });
  });
</script>
</body>
</html>
